name: RU_LIFE Cloudflare Preview Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru-life-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: ru-life-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RU_LIFE_PREVIEW_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PREVIEW_D1_DATABASE_ID }}
      RU_LIFE_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      RU_LIFE_PREVIEW_ORIGIN: ${{ vars.RU_LIFE_PREVIEW_ORIGIN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Require preview basics
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RU_LIFE_PREVIEW_D1_DATABASE_ID RU_LIFE_PRODUCTION_D1_DATABASE_ID; do
            [[ -n "${!key:-}" ]] || { echo "::error::$key is required."; exit 1; }
          done

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Package preview
        run: npm run cloudflare:preview:prepare

      - name: Apply preview migrations
        run: npx wrangler d1 migrations apply ru-life-preview-db --remote --config wrangler.cloudflare.preview.jsonc

      - name: Build preview
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.preview.jsonc
        run: npm run build

      - name: Deploy preview
        run: npx wrangler deploy --config wrangler.cloudflare.preview.jsonc

      - name: Quick availability check
        if: ${{ env.RU_LIFE_PREVIEW_ORIGIN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if curl --fail --silent --show-error --max-time 10 "$RU_LIFE_PREVIEW_ORIGIN/" >/dev/null; then
              echo "Preview reachable."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Preview did not become reachable."
          exit 1
