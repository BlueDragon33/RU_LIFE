name: RU_LIFE Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PREVIEW để triển khai RU_LIFE preview riêng"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ru-life-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: ru-life-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RU_LIFE_PREVIEW_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PREVIEW_D1_DATABASE_ID }}
      RU_LIFE_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PRODUCTION_D1_DATABASE_ID }}
      RU_LIFE_CONTROL_SERVICE_SECRET: ${{ secrets.RU_LIFE_CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      RU_LIFE_PREVIEW_ORIGIN: ${{ vars.RU_LIFE_PREVIEW_ORIGIN }}
    steps:
      - name: Require explicit preview confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "DEPLOY_PREVIEW" ]]; then
            echo '::error::Deployment cancelled. Enter DEPLOY_PREVIEW exactly.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Require preview credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RU_LIFE_PREVIEW_D1_DATABASE_ID RU_LIFE_CONTROL_SERVICE_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the ru-life-preview GitHub environment."
              exit 1
            fi
          done
          if [[ ${#RU_LIFE_CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::RU_LIFE_CONTROL_SERVICE_SECRET must contain at least 32 characters.'
            exit 1
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate repository before deployment
        run: |
          npm run lint
          npm test
          npm run validate:cloudflare-preview

      - name: Materialize isolated preview config
        run: npm run cloudflare:preview:prepare

      - name: Apply migrations to preview D1 only
        run: npx wrangler d1 migrations apply ru-life-preview-db --remote --config wrangler.cloudflare.preview.jsonc

      - name: Build with Cloudflare preview bindings
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.preview.jsonc
        run: npm run build

      - name: Verify generated deployment artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/wrangler.json
          test -f dist/server/index.js
          test -f .wrangler/deploy/config.json
          if grep -R "00000000-0000-0000-0000-000000000001" dist/wrangler.json .wrangler/deploy/config.json; then
            echo '::error::Generated preview artifact references the RU_LIFE local D1 placeholder.'
            exit 1
          fi
          if [[ -n "${RU_LIFE_PRODUCTION_D1_DATABASE_ID:-}" ]] && grep -R "$RU_LIFE_PRODUCTION_D1_DATABASE_ID" dist/wrangler.json .wrangler/deploy/config.json; then
            echo '::error::Generated preview artifact references RU_LIFE production D1.'
            exit 1
          fi

      - name: Deploy RU_LIFE preview Worker
        run: npx wrangler deploy

      - name: Install or rotate RU_LIFE control secret
        shell: bash
        run: printf '%s' "$RU_LIFE_CONTROL_SERVICE_SECRET" | npx wrangler secret put RU_LIFE_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.preview.jsonc

      - name: Smoke test public preview shell
        if: ${{ env.RU_LIFE_PREVIEW_ORIGIN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RU_LIFE_PREVIEW_ORIGIN" in
            https://*) ;;
            *) echo '::error::RU_LIFE_PREVIEW_ORIGIN must be an HTTPS origin.'; exit 1 ;;
          esac
          curl --fail --silent --show-error --max-time 15 "$RU_LIFE_PREVIEW_ORIGIN/" > /tmp/ru-life-home.html
          test -s /tmp/ru-life-home.html
          echo 'RU_LIFE public shell smoke PASS.'

      - name: Deployment boundary summary
        shell: bash
        run: |
          echo 'RU_LIFE preview deployment completed.'
          echo 'D1: ru-life-preview-db (isolated).'
          echo 'Worker: ru-life-preview.'
          echo 'Automatic production deployment remains disabled.'
