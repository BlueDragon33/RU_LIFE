name: RU_LIFE Cloudflare Preview CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run validate:cloudflare-preview
