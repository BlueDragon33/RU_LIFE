name: RU LIFE Live Development Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru-life-live-development
  cancel-in-progress: true

jobs:
  deploy_live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: ru-life-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RU_LIFE_PREVIEW_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PREVIEW_D1_DATABASE_ID }}
      RU_LIFE_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      RU_LIFE_PREVIEW_ORIGIN: ${{ vars.RU_LIFE_PREVIEW_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Detect live readiness
        id: ready
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RU_LIFE_PREVIEW_D1_DATABASE_ID RU_LIFE_PRODUCTION_D1_DATABASE_ID; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live development publish skipped; missing: ${missing[*]}"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: npm install --no-audit --no-fund
      - name: Package standalone live config
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: npm run cloudflare:preview:prepare
      - name: Apply D1 migrations
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: npx wrangler d1 migrations apply ru-life-preview-db --remote --config wrangler.cloudflare.preview.jsonc
      - name: Build
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.preview.jsonc npm run build
      - name: Deploy live development Worker
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: npx wrangler deploy
      - name: Summary
        if: ${{ always() }}
        run: |
          echo "RU LIFE Standalone Development Mode"
          echo "main publishes to the public development Worker"
