name: RU LIFE Live Development Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru-life-live-development
  cancel-in-progress: true

jobs:
  deploy_live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: ru-life-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RU_LIFE_PREVIEW_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PREVIEW_D1_DATABASE_ID }}
      RU_LIFE_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      RU_LIFE_PREVIEW_ORIGIN: ${{ vars.RU_LIFE_PREVIEW_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Detect live readiness
        id: ready
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RU_LIFE_PREVIEW_D1_DATABASE_ID RU_LIFE_PRODUCTION_D1_DATABASE_ID; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Live development deployment blocked; missing configuration: ${missing[*]}"
            {
              echo "### RU_LIFE preview deployment blocked"
              echo "Required GitHub Environment secrets are not configured: ${missing[*]}"
              echo "No build, D1 migration or Worker publish occurred. This workflow must not be interpreted as a successful deploy."
              echo "This Cloudflare Worker pipeline is separate from ChatGPT Sites publishing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Install
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: npm install --no-audit --no-fund
      - name: Package standalone live config
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: npm run cloudflare:preview:prepare
      - name: Apply D1 migrations
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: npx wrangler d1 migrations apply ru-life-preview-db --remote --config wrangler.cloudflare.preview.jsonc
      - name: Build
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.preview.jsonc npm run build
      - name: Deploy live development Worker
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        run: npx wrangler deploy
      - name: Summary
        if: ${{ success() && steps.ready.outputs.deploy == 'true' }}
        run: |
          echo "Deployment was executed successfully to the configured Cloudflare development Worker." >> "$GITHUB_STEP_SUMMARY"
          echo "ChatGPT Sites publishing is a separate explicit release action." >> "$GITHUB_STEP_SUMMARY"
