name: RU_LIFE Live Development Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ru-life-live-development
  cancel-in-progress: true

jobs:
  deploy-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: ru-life-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RU_LIFE_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PRODUCTION_D1_DATABASE_ID }}
      RU_LIFE_PREVIEW_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      RU_LIFE_PRODUCTION_ORIGIN: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Detect live readiness
        id: ready
        shell: bash
        run: |
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RU_LIFE_PRODUCTION_D1_DATABASE_ID RU_LIFE_PREVIEW_D1_DATABASE_ID APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN RU_LIFE_PRODUCTION_ORIGIN; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live publish skipped; missing: ${missing[*]}"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.ready.outputs.deploy == 'true'
        run: npm install --no-audit --no-fund

      - name: Materialize live config
        if: steps.ready.outputs.deploy == 'true'
        run: node scripts/prepare-cloudflare-production.mjs

      - name: Apply D1 migrations
        if: steps.ready.outputs.deploy == 'true'
        run: npx wrangler d1 migrations apply ru-life-production-db --remote --config wrangler.cloudflare.production.jsonc

      - name: Build current main
        if: steps.ready.outputs.deploy == 'true'
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.production.jsonc
        run: npm run build

      - name: Deploy live Worker
        if: steps.ready.outputs.deploy == 'true'
        run: npx wrangler deploy

      - name: Summary
        if: always()
        run: echo "RU_LIFE Standalone Development Mode: main is the live development source."
