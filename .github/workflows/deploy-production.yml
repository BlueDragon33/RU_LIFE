name: RU_LIFE Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PRODUCTION để triển khai RU_LIFE Production"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ru-life-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: ru-life-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RU_LIFE_PRODUCTION_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PRODUCTION_D1_DATABASE_ID }}
      RU_LIFE_PREVIEW_D1_DATABASE_ID: ${{ secrets.RU_LIFE_PREVIEW_D1_DATABASE_ID }}
      RU_LIFE_CONTROL_SERVICE_SECRET: ${{ secrets.RU_LIFE_CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN }}
      RU_LIFE_PRODUCTION_ORIGIN: ${{ vars.RU_LIFE_PRODUCTION_ORIGIN }}
      RU_LIFE_ACCESS_MODE: managed
    steps:
      - name: Require explicit production confirmation
        run: |
          set -euo pipefail
          [[ "${{ inputs.confirm }}" == "DEPLOY_PRODUCTION" ]] || { echo "::error::Enter DEPLOY_PRODUCTION exactly."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Validate production configuration
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID RU_LIFE_PRODUCTION_D1_DATABASE_ID RU_LIFE_PREVIEW_D1_DATABASE_ID RU_LIFE_CONTROL_SERVICE_SECRET APPLICATION_MANAGEMENT_PRODUCTION_ORIGIN RU_LIFE_PRODUCTION_ORIGIN; do
            [[ -n "${!key:-}" ]] || { echo "::error::$key is required in ru-life-production."; exit 1; }
          done
          [[ ${#RU_LIFE_CONTROL_SERVICE_SECRET} -ge 32 ]] || { echo "::error::RU_LIFE_CONTROL_SERVICE_SECRET must be >=32 chars."; exit 1; }
          [[ "$RU_LIFE_PRODUCTION_D1_DATABASE_ID" != "$RU_LIFE_PREVIEW_D1_DATABASE_ID" ]] || { echo "::error::Production D1 must differ from Preview."; exit 1; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Preserve regressions
        run: |
          npm run lint
          npm test
      - name: Materialize production config
        run: node scripts/prepare-cloudflare-production.mjs
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply ru-life-production-db --remote --config wrangler.cloudflare.production.jsonc
      - name: Build production runtime
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.production.jsonc
        run: npm run build
      - name: Verify generated production artifact
        run: node scripts/validate-cloudflare-production-artifact.mjs
      - name: Deploy Production Worker
        run: npx wrangler deploy
      - name: Install control secret
        run: printf '%s' "$RU_LIFE_CONTROL_SERVICE_SECRET" | npx wrangler secret put RU_LIFE_CONTROL_SERVICE_SECRET --config wrangler.cloudflare.production.jsonc
      - name: Restore exact production artifact after secret version
        run: npx wrangler deploy
      - name: Smoke test runtime and control status
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$RU_LIFE_PRODUCTION_ORIGIN/" >/tmp/ru-life-home.html
          CODE="$(curl --silent --show-error --output /tmp/ru-life-status.json --write-out '%{http_code}' --max-time 20 -H "Authorization: Bearer $RU_LIFE_CONTROL_SERVICE_SECRET" "$RU_LIFE_PRODUCTION_ORIGIN/api/control/status")"
          [[ "$CODE" == "200" ]] || { cat /tmp/ru-life-status.json; exit 1; }
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          const v=JSON.parse(fs.readFileSync("/tmp/ru-life-status.json","utf8"));
          if(v.application!=="ru-life" && v.canonicalApplication!=="ru-life") throw new Error("RU_LIFE production identity mismatch.");
          const c=v.capabilities??{};
          if(!c.deviceRegistry) throw new Error("RU_LIFE device registry is not ready.");
          console.log("RU_LIFE Production control smoke PASS.");
          NODE
